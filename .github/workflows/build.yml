name: APK yig'ish

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zipni ochish
        run: |
          mkdir src
          unzip -o "ZenoApp_fixed-3.zip" -d src
          DIR=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "APPDIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: APK yig'ish
        working-directory: ${{ env.APPDIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zeno-APK
          path: ${{ env.APPDIR }}/app/build/outputs/apk/debug/app-debug.apk
